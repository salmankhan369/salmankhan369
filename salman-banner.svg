      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes spinSlow {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      .pulse { animation: pulse 2.2s infinite ease-in-out; }
      .float { animation: float 4s infinite ease-in-out; }
      .spin { transform-origin: 585px 315px; animation: spinSlow 24s linear infinite; }
      .flow-line { stroke-dasharray: 6 6; animation: dashMove 1.8s linear infinite; }
